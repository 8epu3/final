{% extends "layout.html" %}
{% block title %}Profile - Calculations App{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
  <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">My Profile</h1>

  <!-- Dynamic Success/Error Alerts (populated by JS) -->
  <div id="alertContainer"></div>

  <div id="profileContent" class="hidden"> <!-- Hidden until user loaded -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Update Profile Form -->
      <div class="bg-white shadow-lg rounded-lg p-8 border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
          <svg class="w-6 h-6 mr-3 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          Update Profile
        </h2>

        <!-- REPLACE THIS ENTIRE FORM (from <form id="updateForm"...> to </form>) -->
        <form id="updateForm" action="/profile/update" class="space-y-5">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">First Name</label>
              <input type="text" name="first_name" id="first_name" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Last Name</label>
                <input type="text" name="last_name" id="last_name" required
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Username</label>
              <input type="text" name="username" id="username" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Email</label>
              <input type="email" name="email" id="email" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <button type="submit"
              class="w-full bg-blue-700 text-white py-2.5 px-4 rounded-md hover:bg-blue-800 transition font-medium">
              Update Profile
            </button>
          </div>
        </form>

      </div>


      <!-- Change Password Form -->
      <div class="bg-white shadow-lg rounded-lg p-8 border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
          <svg class="w-6 h-6 mr-3 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
            </path>
          </svg>
          Change Password
        </h2>

        <form id="passwordForm" method="POST" action="/profile/change-password" class="space-y-5">
          <input type="hidden" name="csrf_token" id="password_csrf_token">
          <div>
            <label class="block text-sm font-medium text-gray-700">Current Password</label>
            <input type="password" name="current_password" required
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">New Password</label>
            <input type="password" name="new_password" required minlength="8"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Confirm New Password</label>
            <input type="password" name="confirm_new_password" required minlength="8"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
          </div>

          <button type="submit"
            class="w-full bg-red-600 text-white py-2.5 px-4 rounded-md hover:bg-red-700 transition font-medium">
            Change Password
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="mt-8 text-center">
    <a href="/dashboard" class="text-blue-600 hover:text-blue-800 underline">
      ← Back to Dashboard
    </a>
  </div>

  <!-- Loading State -->
  <div id="loadingState" class="text-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700 mx-auto mb-4"></div>
    <p>Loading profile...</p>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async function () {
    const token = localStorage.getItem('access_token');
    if (!token) {
      alert('Please log in again');
      window.location.href = '/login';
      return;
    }

    // 1. Load current user data and pre-fill form
    try {
      const meRes = await fetch('/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!meRes.ok) throw new Error('Failed to load user');
      const user = await meRes.json();

      document.getElementById('first_name').value = user.first_name || '';
      document.getElementById('last_name').value = user.last_name || '';
      document.getElementById('username').value = user.username || '';
      document.getElementById('email').value = user.email || '';

      document.getElementById('profileContent').classList.remove('hidden');
      document.getElementById('loadingState').remove();
    } catch (e) {
      alert('Session expired – redirecting to login');
      localStorage.clear();
      window.location.href = '/login';
    }

    // 2. Handle BOTH forms exactly the same way
    document.getElementById('updateForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const res = await fetch('/profile/update', {
          method: 'POST',
          body: formData,
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const html = await res.text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        alert('Update failed – please try again');
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(this);

      try {
        const res = await fetch('/profile/change-password', {
          method: 'POST',
          body: formData,
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const html = await res.text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        alert('Password change failed');
      }
    });
  });
</script>{% endblock %}
